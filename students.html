<!DOCTYPE html>
<html>
<head>
  <title>Students - Student Management System</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">Student Management System</span>
  <div>
    <a href="index.html" class="text-white me-3">Dashboard</a>
    <a href="students.html" class="text-white me-3">Students</a>
    <a href="about.html" class="text-white">About</a>
  </div>
</nav>

<div class="container mt-4">

  <div class="text-center mb-4">
    <h1>Student Management</h1>
    <p>Add, edit, delete and search student records</p>
  </div>

  <div class="card p-4 shadow-lg">

    <div class="row g-2 mb-3">
      <div class="col"><input id="name" class="form-control" placeholder="Student Name"></div>
      <div class="col"><input id="roll" class="form-control" placeholder="Roll No"></div>
      <div class="col"><input id="course" class="form-control" placeholder="Course"></div>
      <div class="col"><button class="btn btn-primary w-100" onclick="addStudent()">Add</button></div>
    </div>

    <input id="search" class="form-control mb-3" placeholder="Search student...">

    <button class="btn btn-secondary mb-3" onclick="clearAll()">Clear All</button>

    <h5>Total Students: <span id="count">0</span></h5>

    <ul id="list" class="list-group mt-3"></ul>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
