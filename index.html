<!DOCTYPE html>
<html>
<head>
  <title>Student Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <h1 class="text-center mb-2">🎓 Student Hub</h1>
  <p class="text-center text-muted mb-4">
    A simple system to manage student records efficiently
  </p>

  <div class="card p-4 shadow">
    
    <div class="input-group mb-3">
      <input id="name" class="form-control" placeholder="Enter student name">
      <button class="btn btn-primary" onclick="addStudent()">Add Student</button>
    </div>

    <!-- SEARCH -->
    <input id="search" class="form-control mb-3" placeholder="Search student...">

    <!-- TOTAL COUNT -->
    <h5 class="mb-3">Total Students: <span id="count">0</span></h5>

    <ul id="list" class="list-group"></ul>

  </div>

</div>

<footer class="text-center mt-5 text-muted">
  <p>Developed by Rahul | BCA Final Year Project</p>
</footer>

<script src="script.js"></script>

</body>
</html>
