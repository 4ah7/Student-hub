<!DOCTYPE html>
<html>
<head>
  <title>Student Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      color: black;
      border-radius: 15px;
    }

    .header {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="container mt-4">

  <!-- HEADER -->
  <div class="header p-4 text-center mb-4">
    <h2 class="mb-1">IEC University</h2>
    <p class="mb-0">Student Record Management System</p>
  </div>

  <!-- MAIN CARD -->
  <div class="card p-4 shadow">
    
    <div class="row g-2 mb-3">
      <div class="col">
        <input id="name" class="form-control" placeholder="Student Name">
      </div>
      <div class="col">
        <input id="roll" class="form-control" placeholder="Roll No">
      </div>
      <div class="col">
        <input id="course" class="form-control" placeholder="Course">
      </div>
      <div class="col">
        <button class="btn btn-primary w-100" onclick="addStudent()">Add</button>
      </div>
    </div>

    <input id="search" class="form-control mb-3" placeholder="Search student...">

    <button class="btn btn-secondary mb-3" onclick="clearAll()">Clear All Records</button>

    <h5 class="mb-3">Total Students: <span id="count">0</span></h5>

    <ul id="list" class="list-group"></ul>

  </div>

</div>

<footer class="text-center mt-4 text-light">
  <p>Developed by Rahul | BCA Final Year Project</p>
</footer>

<script src="script.js"></script>

</body>
</html>
