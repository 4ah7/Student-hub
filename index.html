<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Student Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#1e3c72; color:white; }
    .card { border-radius:12px; }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">Student Hub</span>
  <div>
    <a href="index.html" class="text-white me-3">Dashboard</a>
    <a href="students.html" class="text-white me-3">Students</a>
    <a href="about.html" class="text-white">About</a>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="mb-4">Dashboard</h2>

  <div class="row">

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <h4>Total Students</h4>
        <h2 id="totalStudents">0</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <h4>Courses</h4>
        <h2 id="totalCourses">0</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <h4>Records</h4>
        <h2 id="records">0</h2>
      </div>
    </div>

  </div>
</div>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];

document.getElementById("totalStudents").textContent = students.length;

let courses = new Set(students.map(s => s.course));
document.getElementById("totalCourses").textContent = courses.size;

document.getElementById("records").textContent = students.length;
</script>

</body>
</html>
