<!DOCTYPE html>
<html>
<head>
  <title>Student Details</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">Student Hub</span>
  <a href="students.html" class="text-white">Back</a>
</nav>

<div class="container mt-5">
  <div class="card p-4">
    <h3>Student Details</h3>
    <p><strong>Name:</strong> <span id="name"></span></p>
    <p><strong>Roll:</strong> <span id="roll"></span></p>
    <p><strong>Course:</strong> <span id="course"></span></p>
  </div>
</div>

<script>
let index = localStorage.getItem("viewIndex");
let students = JSON.parse(localStorage.getItem("students")) || [];

let s = students[index];

document.getElementById("name").textContent = s.name;
document.getElementById("roll").textContent = s.roll;
document.getElementById("course").textContent = s.course;
</script>

</body>
</html>
